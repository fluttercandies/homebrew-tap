# 定时（或手动）运行通用 Formula 升级脚本：遍历 Formula/ 下所有符合
# "GitHub Release 资产 URL 内嵌版本号" 约定的 formula，发现上游新 tag 时
# 自动重写 URL 与 sha256、过 brew style 并提交推送。新增工具只需按约定
# 添加 Formula，本工作流无需改动。脚本逻辑见 scripts/bump-formula.rb。
name: Bump

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump stale formulae
    runs-on: ubuntu-latest
    if: github.repository == 'fluttercandies/homebrew-tap'
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump formulae
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ruby scripts/bump-formula.rb
